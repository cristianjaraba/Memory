<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <!-- Preloaded so the hover arrow does not flicker on first hover -->
    <link rel="preload" as="image" href="/assets/icons/arrow-right-hover.svg">
</head>

<body>
    <!-- Home screen: entry point of the game -->
    <section class="home" id="home">
        <header class="home__intro">
            <p class="home__kicker">It's play time.</p>
            <h1 class="home__title">Ready to play?</h1>
        </header>

        <button class="home__play" type="button">
            <img class="home__play-icon" src="/assets/icons/stadia_controller.svg" alt="" aria-hidden="true">
            <span class="home__play-label">Play</span>
            <span class="home__play-arrow" aria-hidden="true"></span>
        </button>

        <!-- Decorative watermark in the lower left corner -->
        <span class="home__watermark" aria-hidden="true"></span>
    </section>

    <!-- Settings: everything the player picks before a round starts -->
    <section class="settings" id="settings" hidden>
        <h2 class="settings__title">Settings</h2>
        <!-- Decorative rule below the title: diamond plus line -->
        <span class="settings__rule" aria-hidden="true"></span>

        <!-- Everything the player picks, grouped so it can be placed as one block -->
        <form class="settings__content">
            <!-- Left column: every option list -->
            <div class="settings__lists">
                <fieldset class="settings__group">
                    <legend class="settings__legend">
                        <img class="settings__legend-icon" src="/assets/icons/palette.svg" alt="" aria-hidden="true">
                        <span class="settings__legend-text">Game themes</span>
                    </legend>
                    <ul class="settings__options settings__options--themes">
                        <li class="settings__option">
                            <input class="settings__input" type="radio" name="theme" id="theme-gaming" value="gaming">
                            <label class="settings__label" for="theme-gaming">Gaming theme</label>
                            <img class="settings__preview" width="460" height="412" src="/assets/games_theme_cards/games_theme_preview.png"
                                alt="Cards of the Gaming theme">
                        </li>
                        <li class="settings__option">
                            <input class="settings__input" type="radio" name="theme" id="theme-foods" value="foods">
                            <label class="settings__label" for="theme-foods">Foods theme</label>
                            <img class="settings__preview" width="460" height="412" src="/assets/food_theme_cards/foods_theme_preview.png"
                                alt="Cards of the Foods theme">
                        </li>
                    </ul>
                </fieldset>

                <fieldset class="settings__group">
                    <legend class="settings__legend">
                        <img class="settings__legend-icon" src="/assets/icons/chess_pawn.svg" alt="" aria-hidden="true">
                        <span class="settings__legend-text">Chose player</span>
                    </legend>
                    <ul class="settings__options">
                        <li class="settings__option">
                            <input class="settings__input" type="radio" name="player-color" id="player-blue" value="blue">
                            <label class="settings__label" for="player-blue">Blue</label>
                        </li>
                        <li class="settings__option">
                            <input class="settings__input" type="radio" name="player-color" id="player-orange" value="orange">
                            <label class="settings__label" for="player-orange">Orange</label>
                        </li>
                    </ul>
                </fieldset>

                <fieldset class="settings__group">
                    <legend class="settings__legend">
                        <img class="settings__legend-icon" src="/assets/icons/style.svg" alt="" aria-hidden="true">
                        <span class="settings__legend-text">Board size</span>
                    </legend>
                    <ul class="settings__options">
                        <li class="settings__option">
                            <input class="settings__input" type="radio" name="board-size" id="board-16" value="16">
                            <label class="settings__label" for="board-16">16 cards</label>
                        </li>
                        <li class="settings__option">
                            <input class="settings__input" type="radio" name="board-size" id="board-24" value="24">
                            <label class="settings__label" for="board-24">24 cards</label>
                        </li>
                        <li class="settings__option">
                            <input class="settings__input" type="radio" name="board-size" id="board-36" value="36">
                            <label class="settings__label" for="board-36">36 cards</label>
                        </li>
                    </ul>
                </fieldset>
            </div>

            <!-- Overview of the picked options, it fills up while choosing -->
            <div class="settings__panel">
                <aside class="settings__summary" aria-label="Your current selection">
                    <!--
                        Lies over the panel and takes the click that uncovers
                        the picks. It only answers once all three of them are
                        in and leaves the panel as soon as it was pressed
                    -->
                    <button class="settings__reveal" type="button" id="summary-reveal"
                        aria-controls="summary-list" aria-label="Show the picked options" disabled></button>

                    <ul class="settings__summary-list" id="summary-list">
                        <li class="settings__summary-item">
                            <output class="settings__summary-value" id="summary-theme" aria-label="Game theme" data-placeholder="Theme"></output>
                        </li>
                        <li class="settings__summary-item">
                            <output class="settings__summary-value" id="summary-player" aria-label="Player" data-placeholder="Player"></output>
                        </li>
                        <li class="settings__summary-item">
                            <output class="settings__summary-value" id="summary-board" aria-label="Boardsize" data-placeholder="Board size"></output>
                        </li>
                    </ul>

                    <button class="settings__start" type="button" disabled>
                        <!-- Drawn as a mask, so it follows the ink of the label beside it -->
                        <span class="settings__start-icon" aria-hidden="true"></span>
                        Start
                    </button>
                </aside>
            </div>
        </form>
    </section>

    <!-- Game board, revealed once a round starts -->
    <section class="field" id="field" hidden>
        <!-- Status bar above the cards: both players, whose turn it is, way out -->
        <header class="field__hud">
            <!-- Panel with both players, each one in its own colour -->
            <ul class="field__players">
                <li class="field__player" data-player="blue">
                    <span class="field__player-marker" aria-hidden="true"></span>
                    <span class="field__player-name">Blue</span>
                    <output class="field__score" id="score-blue" aria-label="Points of Blue">0</output>
                </li>
                <li class="field__player" data-player="orange">
                    <span class="field__player-marker" aria-hidden="true"></span>
                    <span class="field__player-name">Orange</span>
                    <output class="field__score" id="score-orange" aria-label="Points of Orange">0</output>
                </li>
            </ul>

            <!-- Whose turn it is, the marker takes the colour of that player -->
            <p class="field__turn">
                <span class="field__turn-label">Current player:</span>
                <output class="field__turn-marker" id="turn-marker" data-player="blue" aria-label="Blue"></output>
            </p>

            <button class="field__exit" type="button">
                <span class="field__exit-icon" aria-hidden="true"></span>
                <span class="field__exit-label">Exit game</span>
            </button>
        </header>

        <ul class="field__board" id="board"></ul>

        <!--
            Asked before a round is given up. The form closes the dialog by
            itself, the value of the pressed button says which way was taken
        -->
        <dialog class="field__quit" id="quit-dialog" aria-labelledby="quit-question">
            <h2 class="field__quit-question" id="quit-question">Are you sure you want to quit the game?</h2>
            <form class="field__quit-actions" method="dialog">
                <button class="field__quit-button field__quit-button--stay" type="submit" value="stay" autofocus>Back to game</button>
                <button class="field__quit-button field__quit-button--exit" type="submit" value="quit">Exit game</button>
            </form>
        </dialog>
    </section>

    <!--
        Closing screen of a round. It carries one block per outcome, the one
        the round ended on is shown, the other two stay hidden
    -->
    <section class="result" id="result" hidden>
        <!-- The picked player was beaten: the round closes on both scores -->
        <article class="result__outcome" id="result-lost" hidden>
            <h2 class="result__title">
                <span class="result__shout">Game over</span>
            </h2>
            <p class="result__lead">Final score</p>

            <!-- Both players with the points they closed the round on -->
            <ul class="field__players result__players">
                <li class="field__player" data-player="blue">
                    <span class="field__player-marker" aria-hidden="true"></span>
                    <span class="field__player-name">Blue</span>
                    <output class="field__score" id="result-score-blue" aria-label="Points of Blue">0</output>
                </li>
                <li class="field__player" data-player="orange">
                    <span class="field__player-marker" aria-hidden="true"></span>
                    <span class="field__player-name">Orange</span>
                    <output class="field__score" id="result-score-orange" aria-label="Points of Orange">0</output>
                </li>
            </ul>

            <button class="result__home" type="button">Home</button>
        </article>

        <!-- The picked player took the round -->
        <article class="result__outcome" id="result-won" hidden>
            <h2 class="result__title">
                <span class="result__lead">The winner is</span>
                <!-- Name and colour are written in while the round is closed -->
                <span class="result__winner" id="result-winner" data-player="blue">Blue Player</span>
            </h2>

            <!-- Gaming hands its winner a cup, Foods the figure that player played with -->
            <img class="result__cup" width="308" height="364" src="/assets/icons/winncup.svg"
                alt="A golden cup for the player who found the most pairs">
            <span class="result__badge result__badge--winner" id="result-badge" data-player="blue"
                role="img" aria-label="The figure of the winning player"></span>

            <button class="result__home" type="button">Home</button>
        </article>

        <!-- Both players found the same number of pairs -->
        <article class="result__outcome" id="result-draw" hidden>
            <h2 class="result__title">
                <span class="result__lead">It's a</span>
                <span class="result__shout result__shout--draw">Draw</span>
            </h2>

            <!-- Drawn as a mask, so every theme tints the scales its own way -->
            <span class="result__badge result__badge--draw" role="img"
                aria-label="A pair of scales in balance, neither player is ahead"></span>

            <button class="result__home" type="button">Home</button>
        </article>
    </section>

    <!-- Markup of one card, cloned once per card of the picked board size -->
    <template id="card-template">
        <li class="field__cell">
            <button class="card" type="button">
                <span class="card__inner">
                    <span class="card__face"></span>
                    <span class="card__face card__face--back">
                        <!-- Motif of the card, it is filled in while the board is built -->
                        <img class="card__motif" src="" alt="">
                    </span>
                </span>
            </button>
        </li>
    </template>

    <!--
        Filter of the Foods theme: it pushes the frame of the exit button off
        its straight run, just enough to take the machine out of the line. The
        svg carries nothing visible, it only holds the filter for the stylesheet.
    -->
    <svg class="filters" aria-hidden="true" focusable="false" width="0" height="0">
        <defs>
            <filter id="sketchy-frame" x="-10%" y="-30%" width="120%" height="160%">
                <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="1" seed="3"
                    result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R"
                    yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
